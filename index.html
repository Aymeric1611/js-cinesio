<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div>
        <h1>Gestionnaire de films</h1>
    </div>
    <div>
        <p>Ajoutez des films à votre collection</p>
    </div>
    <div>
        <form action="POST">
            <div>
                <h2>Ajouter un film</h2>
            </div>
            <div>
                <label for="">Titre</label>
                <input type="text" name="titre" id="titre">
                <label for="message-erreur"></label>
            </div>
            <div>
                <label for="">Réalisateur</label>
                <input type="text" name="realisateur" id="realisateur">
                <label for="message-erreur"></label>
            </div>
            <div>
                <label for="" >Année de sortie</label>
                <input type="number" name="anneeSortie" id="anneeSortie" min="1885" max="2026">
                <label for="message-erreur"></label>
            </div>
            <div>
                <label for="">Durée (minutes)</label>
                <input type="number" name="duree" id="duree" min="1">
                <label for="message-erreur"></label>
            </div>
            <div>
                <label for="">Genre</label>
                <select name="genre" id="">
                    <option value="">-- Choisir un genre --</option>
                    <option value="action">Action</option>
                    <option value="comedie">Comédie</option>
                    <option value="drame">Drame</option>
                    <option value="science-fiction">Science-fiction</option>
                    <option value="thriller">Thriller</option>
                    <option value="animation">Animation</option>
                </select>
                <label for="message-erreur"></label>
            </div>
            <div>
                <button>Ajouter le film</button>
            </div>
        </form>
        <div>
            <h2>Films enregistrés</h2>
            <button>Tout supprimer</button>
        </div>
    </div>
</body>

<script src="script.js"></script>

</html>
